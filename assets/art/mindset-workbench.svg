  <ellipse cx="280" cy="167" rx="79" ry="17" fill="url(#halo)"/>
  <ellipse cx="265" cy="91" rx="99" ry="93" fill="url(#halo)"/>
  <ellipse cx="269" cy="163" rx="34" ry="6" fill="#081920" opacity=".8"/>
