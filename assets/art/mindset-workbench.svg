<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 258" width="420" height="258" role="img" aria-labelledby="title description">
  <title id="title">The workbench after dark</title>
  <desc id="description">A glass prototype bulb lights a pencil and an open notebook. A snow-capped ridge is visible through the studio window.</desc>
  <defs>
    <linearGradient id="sky" x2=".25" y2="1"><stop stop-color="#081725"/><stop offset=".58" stop-color="#24425b"/><stop offset="1" stop-color="#9d849d"/></linearGradient>
    <linearGradient id="desk" x2=".4" y2="1"><stop stop-color="#254046"/><stop offset=".55" stop-color="#11292f"/><stop offset="1" stop-color="#081621"/></linearGradient>
    <linearGradient id="glass" x2=".84" y2="1"><stop stop-color="#e7fff1" stop-opacity=".38"/><stop offset=".25" stop-color="#81eccb" stop-opacity=".05"/><stop offset=".72" stop-color="#99ffe0" stop-opacity=".2"/><stop offset="1" stop-color="#d5ffe4" stop-opacity=".5"/></linearGradient>
    <linearGradient id="brass" x2="1" y2=".12"><stop stop-color="#26454a"/><stop offset=".3" stop-color="#95b9a7"/><stop offset=".56" stop-color="#d6d5ae"/><stop offset="1" stop-color="#3e6262"/></linearGradient>
    <linearGradient id="paper" x2=".9" y2=".8"><stop stop-color="#8eafa3"/><stop offset=".56" stop-color="#c2d4b7"/><stop offset="1" stop-color="#72958d"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#a1ffd0" stop-opacity=".48"/><stop offset=".33" stop-color="#74edc1" stop-opacity=".23"/><stop offset="1" stop-color="#72deb9" stop-opacity="0"/></radialGradient>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="420" height="258" fill="url(#sky)"/>
  <g fill="#d1e4eb"><circle cx="34" cy="33" r="1"/><circle cx="79" cy="16" r=".8"/><circle cx="124" cy="41" r="1.1"/><circle cx="158" cy="24" r=".7"/><circle cx="194" cy="56" r=".9"/><circle cx="239" cy="26" r="1"/><circle cx="306" cy="36" r=".9"/><circle cx="379" cy="20" r="1.2"/></g>
  <path d="M343 28a13 13 0 1 0 15 17 12 12 0 0 1-15-17Z" fill="#f1e6c8"/>
  <path d="m0 123 43-28 25 8 39-39 23 13 17-13 51 42 39-21 23 14 44-47 28 27 23-9 65 53v36H0Z" fill="#52687b"/>
  <path d="m76 95 31-31 23 13-17-4-7-3-8 14-5-1zm200-13 28-30 28 27-17-9-9-9-11 14-4-1z" fill="#bdcad0"/>
  <path d="m0 133 68-22 41 13 35-17 54 18 52-25 49 19 46-20 75 19v49H0Z" fill="#263f50"/>
  <path d="M0 145q67-30 110-11t105-4q67-18 116-3t89-6v41H0Z" fill="#152d39"/>
