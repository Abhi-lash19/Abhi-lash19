<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">A Builder&#x27;s Mindset</title><desc id="desc">Most of my projects begin with a question or a problem. I learn by implementing, breaking things, and figuring them out. AI tools help me move faster, but understanding and verification still matter.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091c29"/><stop offset=".6" stop-color="#07111e"/><stop offset="1" stop-color="#17162f"/></linearGradient><linearGradient id="accent"><stop stop-color="#72f1c6"/><stop offset=".5" stop-color="#6edbff"/><stop offset="1" stop-color="#ad8dff"/></linearGradient><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="598" height="328" rx="10" fill="url(#bg)" stroke="#28445e"/><g opacity=".8" transform="translate(-600 208)"><circle cx="1060" cy="24" r="12" fill="#e0eaff" filter="url(#glow)"/><circle cx="1065" cy="20" r="12" fill="#091725"/><path d="M760 122 827 80 857 94 914 35 963 78 997 63 1065 110 1122 87 1200 122" fill="#182c4c"/><path d="m865 122 49-87 49 43-37-21-12-9-12 25z" fill="#4c658e"/><path d="m750 122 119-24 40 17 59-30 60 37 78-29 94 29" fill="#07101d"/></g><g filter="url(#glow)"><g transform="translate(24 28) scale(2.0)" color="#72f1c6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 18h8M9 21h6M9 16c0-4-4-4-4-9a7 7 0 0114 0c0 5-4 5-4 9M12 16v-5m-3-3 3 3 3-3"/></g></g><text x="92" y="40" font-size="24" fill="#72f1c6" font-weight="700" >A Builder&#x27;s Mindset</text><text x="92" y="72" font-size="21" fill="#f3f6ff" font-weight="400" >Most of my projects begin with a question</text><text x="92" y="101" font-size="21" fill="#f3f6ff" font-weight="400" >or a problem. I learn by implementing,</text><text x="92" y="130" font-size="21" fill="#f3f6ff" font-weight="400" >breaking things, and figuring them out. AI</text><text x="92" y="159" font-size="21" fill="#f3f6ff" font-weight="400" >tools help me move faster, but</text><text x="92" y="188" font-size="21" fill="#f3f6ff" font-weight="400" >understanding and verification still</text><text x="92" y="217" font-size="21" fill="#f3f6ff" font-weight="400" >matter.</text></g></svg>
