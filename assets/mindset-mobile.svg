<svg xmlns="http://www.w3.org/2000/svg" width="410" height="414" viewBox="0 0 410 414" role="img" aria-labelledby="title desc"><title id="title">A Builder&#x27;s Mindset</title><desc id="desc">I build the tools I wish I had. I use AI to explore ideas, then test them on real problems. When something breaks, I want to understand why.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091c29"/><stop offset=".6" stop-color="#07111e"/><stop offset="1" stop-color="#17162f"/></linearGradient><linearGradient id="accent"><stop stop-color="#72f1c6"/><stop offset=".5" stop-color="#6edbff"/><stop offset="1" stop-color="#ad8dff"/></linearGradient><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="408" height="412" rx="10" fill="url(#bg)" stroke="#28445e"/><defs><clipPath id="frame"><rect x="1" y="1" width="408" height="412" rx="10"/></clipPath></defs><g clip-path="url(#frame)"><image x="1" y="208" width="408" height="205" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/></g><defs><linearGradient id="edge" x2="0" y2="1"><stop stop-color="#091623"/><stop offset="1" stop-color="#091623" stop-opacity="0"/></linearGradient></defs><rect x="1" y="208" width="408" height="20" rx="0" fill="url(#edge)" stroke="none"/><text x="20" y="40" font-size="29" fill="#72f1c6" font-weight="700" >A Builder&#x27;s Mindset</text><text x="20" y="78" font-size="21" fill="#f3f6ff" font-weight="650" >I build the tools I wish I had.</text><text x="20" y="108" font-size="19" fill="#dbe6ee" font-weight="400" >I use AI to explore ideas, then test</text><text x="20" y="133" font-size="19" fill="#dbe6ee" font-weight="400" >them on real problems. When something</text><text x="20" y="158" font-size="19" fill="#dbe6ee" font-weight="400" >breaks, I want to understand why.</text><rect x="1" y="1" width="408" height="412" rx="10" fill="none" stroke="#315265"/></g></svg>
