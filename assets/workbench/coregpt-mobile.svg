<svg xmlns="http://www.w3.org/2000/svg" width="360" height="154" viewBox="0 0 360 154" role="img" aria-labelledby="title desc"><title id="title">CoreGPT</title><desc id="desc">Predicting the next token. A small Python transformer uses earlier tokens to generate the next one.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091c29"/><stop offset=".6" stop-color="#07111e"/><stop offset="1" stop-color="#17162f"/></linearGradient><linearGradient id="accent"><stop stop-color="#72f1c6"/><stop offset=".5" stop-color="#6edbff"/><stop offset="1" stop-color="#ad8dff"/></linearGradient><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="358" height="152" rx="8" fill="#0b1927" stroke="#22394d"/><rect x="1" y="10" width="3" height="134" rx="1" fill="#ad8dff" stroke="none"/><text x="17" y="26" font-size="15" fill="#ad8dff" font-weight="650" >CoreGPT</text><text x="17" y="52" font-size="19" fill="#f3f6ff" font-weight="650" >Predicting the next token</text><text x="17" y="79" font-size="15" fill="#b5c7dd" font-weight="400" >A small Python transformer uses earlier</text><text x="17" y="98" font-size="15" fill="#b5c7dd" font-weight="400" >tokens to generate the next one.</text><text x="17" y="139" font-size="14" fill="#ad8dff" font-weight="600" >Read model  ↗</text></g></svg>
