<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260" role="img" aria-labelledby="title desc"><title id="title">How to read these charts</title><desc id="desc"></desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091a28"/><stop offset="1" stop-color="#060d17"/></linearGradient><linearGradient id="accent"><stop stop-color="#68efb5"/><stop offset="1" stop-color="#549aff"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="438" height="258" rx="16" fill="url(#bg)" stroke="#233a4d"/><text x="24" y="35" font-size="22" fill="#f1f7ff" font-weight="600" >Behind the numbers</text><text x="24" y="80" font-size="16" fill="#b8ccdd" font-weight="400" >Public GitHub REST API data.</text><text x="24" y="109" font-size="16" fill="#b8ccdd" font-weight="400" >Every chart has a defined scope.</text><text x="24" y="138" font-size="16" fill="#b8ccdd" font-weight="400" >Bytes describe code, not proficiency.</text><text x="24" y="167" font-size="16" fill="#b8ccdd" font-weight="400" >Project counts include learning work.</text><text x="24" y="196" font-size="16" fill="#b8ccdd" font-weight="400" >No commit totals or productivity scores.</text><text x="24" y="235" font-size="14" fill="#68efb5" font-weight="400" >Snapshot: 2026-10-28 UTC</text></g></svg>
