name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"    # Once daily at 02:00 UTC
  push:
    branches:
      - main               # Also runs on push (prevents GitHub auto-disabling the workflow)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          # User
          user: Abhi-lash19
          filename: github-metrics.svg
          output_action: commit
          committer_branch: output

          # Layout
          template: terminal
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large
          config_padding: 20

          # Languages (Clean + Modern)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: no
          plugin_languages_threshold: 1%
          plugin_languages_other: yes
          plugin_languages_categories: programming, markup, data

          # Contribution Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Recent Activity
          plugin_activity: yes
          plugin_activity_limit: 5

          # Coding Habits - most active hours/days, languages by recent commits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          # Notable contributions made to other/organization repositories
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
