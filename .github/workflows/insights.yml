name: Refresh profile Insights

on:
  schedule:
    - cron: "47 0 * * *" # 06:17 India time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-profile-insights
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Collect fresh public commit and language data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/collect_commits.py
          python3 scripts/collect_stats.py

      - name: Rebuild and verify the profile
        run: |
          python3 scripts/build_profile.py --stats-only
          python3 scripts/validate_profile.py
          python3 -m unittest discover -s tests

      - name: Publish the complete refresh
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- README.md assets/stats data/commit-stats.json data/github-stats.json data/stats-summary.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile Insights'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
