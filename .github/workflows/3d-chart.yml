name: Generate 3D Contribution Chart

on:
  schedule:
    - cron: "0 3 * * 0"    # Weekly (Sunday 03:00 UTC) - not currently shown in README
  push:
    branches:
      - main                 # Ensures workflow runs on push (prevents inactivity disable)
  workflow_dispatch:         # Manual trigger (kept as backup)

permissions:
  contents: read

concurrency:
  group: profile-output-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Generate 3D Contribution
        uses: yoshi389111/github-profile-3d-contrib@fd54cf20784ed9a86dc7be48bb5eb1f74e92b4f8 # 0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Abhi-lash19

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./profile-3d-contrib
          publish_branch: output
          keep_files: true    # Prevents overwriting other generated files
